# Project facts handed to the blind reviewers in pr-review-skeptic.
# These describe the PROJECT, never any individual change.

project: >-
  A collection of Claude Code skills, published as an installable plugin.
  Not an application: no build, no tests, no runtime. The deliverable is
  the prose inside each SKILL.md.

users: >-
  Claude Code users who install the plugin or copy individual skill folders
  into ~/.claude/skills/. Public repo, small installed base; the author is
  the primary user.

irreplaceable_data: >-
  Nothing in THIS repo is unrecoverable -- it is all versioned text. The
  blast radius is on the consuming side, and there are two kinds. First,
  pr-review-loop and pr-review-skeptic drive git and the GitHub API against
  other people's repositories: a defect there posts a review under the
  user's account, resolves threads, pushes commits, or removes a worktree
  and refs from a checkout that is not the skill's own. None of that can be
  unsent, and some of it cannot be undone. Second, and the only genuinely
  irreplaceable data any skill here touches: the `later` store, at
  ~/.claude/later.md and ~/.claude/projects/<mangled>/later.md. It is
  unversioned, sits outside any repository, is rewritten in place, and holds
  thoughts the user deliberately wrote nowhere else. A defect that truncates,
  clobbers or silently misroutes it loses them with no copy anywhere.

production_status: >-
  Published and installable (Claude Code plugin, MIT, public). Skills are
  loaded verbatim by other people's agents, so a bad instruction ships the
  moment it merges -- no staged rollout, no runtime guard.

architecture: >-
  One folder per skill under skills/<name>/, each holding a SKILL.md (YAML
  frontmatter + prose body) plus optional config/ and reference/ files it
  loads on demand by relative path. .claude-plugin/plugin.json lists the
  exported skills. Nearly all of it is instructions an agent reads rather
  than code that runs; the exception is a skill that bundles a POSIX shell
  script it invokes, which is real code and is wrong in the ordinary ways
  code is wrong.

# Lets pr-review-loop's skeptic reviewer post its findings to the PR.
# Only counts when committed to the default branch: it is read from the
# PR's base ref, so a PR cannot grant itself posting rights in its own diff.
allow_agent_posting: true
