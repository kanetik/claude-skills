# Bundled default config for the pr-review skill.
#
# This file is the always-present baseline. It is overridden, per key, by:
#   1. ~/.claude/pr-review.config.yml   (optional; absent in cloud — harmless)
#   2. <orchestrator-repo>/.github/pr-review.config.yml   (project; wins)
#
# Precedence, low -> high:
#   bundled defaults  <  user-level (if present)  <  project .github/pr-review.config.yml
# Merge is per-key: a layer that sets only one key inherits the rest from below.
# See reference/configuration.md for the full override model.

request_on_pr_open: [copilot]   # bots to manually request when a PR is opened
auto_review_grace_seconds: 0    # wait this long after a push for an auto-trigger before manually requesting; bump to ~60 where a Ruleset auto-requests Copilot or similar
wait_check_cadence_seconds: 240 # how often to check during time-based waits (180-270 keeps each check inside the 5-min prompt cache — faster AND cheaper than longer cadences)
max_iterations: 10
