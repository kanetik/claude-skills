# Bundled default config for the pr-review-loop skill.
#
# This file is the always-present baseline. It is overridden, per key, by:
#   1. ~/.claude/pr-review-loop.config.yml   (optional)
#   2. <orchestrator-repo>/.github/pr-review-loop.config.yml   (project; wins)
#
# Precedence, low -> high:
#   bundled defaults  <  user-level (if present)  <  project .github/pr-review-loop.config.yml
# Merge is per-key: a layer that sets only one key inherits the rest from below.
# See reference/configuration.md for the full override model.

# The reviewers the loop drives. ONE list, one role: engaged when the PR opens, re-engaged
# after every fix push, and the set convergence is gauged on. Each entry is either a review
# BOT (copilot, codex, ...) or `skeptic`, the sibling pr-review-skeptic skill -- invoked
# locally rather than requested on the PR, but posting its findings there like any other
# reviewer. Mix freely: [copilot, skeptic] is a reasonable shape.
#
# A reviewer that shows up uninvited (a bot that auto-reviews on push, a review a person
# posted) is still read and triaged -- evaluation is never config-gated. It just isn't
# re-engaged after a push and doesn't hold the loop open.
reviewers: [copilot]

auto_review_grace_seconds: 0    # wait this long after a push for an auto-trigger before manually requesting; bump to ~60 where a Ruleset auto-requests Copilot or similar
wait_check_cadence_seconds: 180 # how often the loop polls while waiting on a BOT (3 min; stay in 120-240 = every 2-4 min; <=270 keeps each check inside the 5-min prompt cache -- faster AND cheaper than longer cadences). Skeptic is never waited on.
max_iterations: 10              # NOT a backstop -- see below

# Why the shipped default is [copilot]: it needs no setup. Copilot is requested with one
# gh call and reviews whatever it is pointed at, so a first run works in any repo with no
# config at all.
#
# `skeptic` is the shape this skill is designed around, and it is worth the setup:
#
#   reviewers: [skeptic]          # or [copilot, skeptic]
#
# Blind subagents read the diff knowing the project but nothing about why the change
# exists, so they judge the code rather than the argument for it -- and because they are
# re-invoked on every fix push, they also read the code the fix rounds produced, which is
# the code with the least review behind it. It needs three things, all checked at kickoff
# (reference/mechanics.md): the skill installed, its five project keys filled, and
# `allow_agent_posting: true` committed to the reviewed repo's own
# .github/pr-review-skeptic.config.yml. That last one is what lets an agent-invoked run
# put its findings on the PR as threads; without it the loop can still fix what it is
# told, but nothing is recorded on the PR, so every round re-finds what the last round
# settled and the loop runs to the cap.
#
# Cost note: each skeptic round stages a worktree and dispatches up to `max_reviewers`
# subagents (8 by default, in that skill's config). Ten rounds is up to eighty reviews.
# Where that is too much, lower max_reviewers there or max_iterations here.
#
# max_iterations is LOAD-BEARING. An adversarial reviewer with no severity floor always
# finds something, so the loop terminates on "nothing left at or above the blocking
# severities" rather than on silence -- and if the fix rounds keep producing new findings,
# the cap is the only thing that ends it. Reaching it is a reported outcome ("did not
# converge"), not a silent stop. Raise it for a large change; lower it to keep a run short.
#
# RETIRED KEYS. Earlier versions had four reviewer lists -- upfront_gate_reviewers,
# request_on_pr_open, loop_reviewers, final_gate_reviewers -- with the two gates running
# their own review/fix/re-review sub-loops around the main one. That is gone: one loop,
# one path from a finding to a fix. A config still setting any of them is folded into
# `reviewers` and the user is told; see reference/configuration.md.
