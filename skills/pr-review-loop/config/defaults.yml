# Bundled default config for the pr-review skill.
#
# This file is the always-present baseline. It is overridden, per key, by:
#   1. ~/.claude/pr-review.config.yml   (optional; absent in cloud — harmless)
#   2. <orchestrator-repo>/.github/pr-review.config.yml   (project; wins)
#
# Precedence, low -> high:
#   bundled defaults  <  user-level (if present)  <  project .github/pr-review.config.yml
# Merge is per-key: a layer that sets only one key inherits the rest from below.
# See reference/configuration.md for the full override model.

request_on_pr_open: [copilot]   # bots to manually request on the first pass (iteration 1)
loop_reviewers: [copilot]       # bots re-requested on every push during the loop. A bot in
                                # request_on_pr_open but NOT here is "first-pass only": requested
                                # once for an adversarial pass, its findings triaged like any other,
                                # then never re-engaged in the loop. Default mirrors request_on_pr_open.
final_gate_reviewers: []        # after the loop converges, request these ONCE more as a final
                                # adversarial gate; if they raise anything, fix it and re-converge the
                                # loop_reviewers. Empty = no final gate. Typically the first-pass-only bots.
auto_review_grace_seconds: 0    # wait this long after a push for an auto-trigger before manually requesting; bump to ~60 where a Ruleset auto-requests Copilot or similar
wait_check_cadence_seconds: 240 # how often to check during time-based waits (180-270 keeps each check inside the 5-min prompt cache — faster AND cheaper than longer cadences)
max_iterations: 10

# Recommended pattern for a rate-limited deep reviewer (e.g. Codex) — set in a project's
# .github/pr-review.config.yml so it doesn't burn its allotment on redundant middle-of-loop re-raises:
#   request_on_pr_open: [copilot, codex]   # both review the first pass
#   loop_reviewers: [copilot]              # only Copilot drives the convergence loop
#   final_gate_reviewers: [codex]          # Codex does one final adversarial pass after convergence
# Empirically the deep reviewer's unique value is its first-look design/correctness catches plus a
# final gate; it adds little to iterative polish, which Copilot handles well.
